<!doctype html>
<!-- Local test fixture imitating a Greenhouse job-board application form (structure only). -->
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Machine Learning Engineer at Fixture Co</title></head>
<body>
<h1>Machine Learning Engineer</h1>
<form id="application-form" action="/submit/greenhouse" method="post" enctype="multipart/form-data">
  <div class="field"><label for="first_name">First Name<span class="required">*</span></label>
    <input id="first_name" name="first_name" type="text" aria-required="true" autocomplete="given-name"></div>
  <div class="field"><label for="last_name">Last Name<span class="required">*</span></label>
    <input id="last_name" name="last_name" type="text" aria-required="true" autocomplete="family-name"></div>
  <div class="field"><label for="email">Email<span class="required">*</span></label>
    <input id="email" name="email" type="text" aria-required="true"></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="candidate-location">Location (City)</label>
    <input id="candidate-location" name="location" type="text"></div>
  <div class="field file-upload">
    <div class="label" id="upload-label-resume">Resume/CV<span class="required">*</span></div>
    <input id="resume" name="resume" type="file" aria-labelledby="upload-label-resume" aria-required="true" style="display:none">
    <button type="button">Attach</button> <button type="button">Enter manually</button>
  </div>
  <div class="field file-upload" id="cover-wrap">
    <div class="label" id="upload-label-cover_letter">Cover Letter</div>
    <input id="cover_letter" name="cover_letter" type="file" aria-labelledby="upload-label-cover_letter" style="display:none">
    <button type="button">Attach</button>
    <button type="button" id="cover-manual" onclick="document.getElementById('cover-text-wrap').style.display='block'">Enter manually</button>
    <div id="cover-text-wrap" style="display:none">
      <label for="cover_letter_text">Cover Letter</label><textarea id="cover_letter_text" name="cover_letter_text"></textarea>
    </div>
  </div>
  <div class="field"><label for="question_1">LinkedIn Profile</label><input id="question_1" name="question_1" type="text"></div>
  <div class="field"><label for="question_2">Website</label><input id="question_2" name="question_2" type="text"></div>
  <div class="field"><label for="question_3">Why do you want to work at Fixture Co?<span>*</span></label>
    <textarea id="question_3" name="question_3" aria-required="true"></textarea></div>
  <div class="field"><label for="question_4">Will you now or in the future require sponsorship for employment visa status?<span>*</span></label>
    <select id="question_4" name="question_4" aria-required="true"><option value=""></option><option>Yes</option><option>No</option></select></div>
  <fieldset><legend>U.S. Equal Employment Opportunity information</legend>
    <label for="gender">Gender</label>
    <select id="gender" name="gender"><option value="">Please select</option><option>Decline to self-identify</option></select>
  </fieldset>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
