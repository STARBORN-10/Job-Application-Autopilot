<!doctype html>
<!-- Local test fixture: a minimal application form with only standard fields (no CAPTCHA, no custom
     questions). Used to test the submit gate: it is only ever submitted to the local test server. -->
<html lang="en">
<head><meta charset="utf-8"><title>Simple application</title></head>
<body>
<form id="application-form" action="/submit/simple" method="post">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="cover">Cover letter</label><textarea id="cover" name="cover"></textarea>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
