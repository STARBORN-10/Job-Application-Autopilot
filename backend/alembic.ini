# Alembic configuration. The database URL is NOT stored here: alembic/env.py reads
# DATABASE_URL (the same variable the app uses, loaded from backend/.env).
#
# Usage (from the backend/ directory):
#   alembic upgrade head        apply all migrations
#   alembic current             show the applied revision
#   alembic revision -m "msg"   create a new migration file
#
# The app also runs "upgrade head" automatically on startup (see db_migrations.py).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
