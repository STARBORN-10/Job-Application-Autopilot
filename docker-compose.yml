version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_autopilot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MAKE_API_KEY=${MAKE_API_KEY:-dev_make_key_secret}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./jobs.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - MAKE_WEBHOOK_URL=${MAKE_WEBHOOK_URL:-}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - AUTO_RUN_INTERVAL_MINUTES=${AUTO_RUN_INTERVAL_MINUTES:-0}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - JOOBLE_API_KEY=${JOOBLE_API_KEY:-}
      - JSEARCH_MONTHLY_BUDGET=${JSEARCH_MONTHLY_BUDGET:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL_EXTRACT=${GROQ_MODEL_EXTRACT:-}
      - GROQ_MODEL_WRITE=${GROQ_MODEL_WRITE:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-}
      - LLM_MAX_JOBS_PER_RUN=${LLM_MAX_JOBS_PER_RUN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_MODE=${TELEGRAM_MODE:-}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - TRIGGER_COOLDOWN_SECONDS=${TRIGGER_COOLDOWN_SECONDS:-}
      - APPLY_DAILY_CAP=${APPLY_DAILY_CAP:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - TUNE_MIN_DECISIONS=${TUNE_MIN_DECISIONS:-}
      - APPLY_DRY_RUN=${APPLY_DRY_RUN:-true}
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app

volumes:
  backend_uploads:
  backend_db:
